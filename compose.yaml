services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seats
      SPRING_DATASOURCE_USERNAME: seats
      SPRING_DATASOURCE_PASSWORD: seats
      # Local-only values. Production sets its own in Render.
      JWT_SECRET: local-dev-secret-at-least-32-bytes-long
      ADMIN_KEY: local-admin-key
    ports:
      - "8080:8080"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
