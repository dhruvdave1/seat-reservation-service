spring.application.name=seat-reservation-service

# Hosts like Render inject PORT.
server.port=${PORT:8080}

# Local defaults match compose.yaml. Override in any environment with
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/seats
spring.datasource.username=seats
spring.datasource.password=seats

# API JSON is snake_case (price_paise, reservation_id). Money is integer paise:
# reject 100.5 instead of silently truncating it to 100.
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.accept-float-as-int=false
# Errors as RFC 9457 problem details.
spring.mvc.problemdetails.enabled=true

# Auth: no defaults. JWT_SECRET (>= 32 bytes) and ADMIN_KEY must be set or startup fails.
app.auth.jwt-secret=${JWT_SECRET}
app.auth.admin-key=${ADMIN_KEY}
app.auth.token-ttl=1h

# Health: liveness never touches the DB; readiness does and fails closed.
# Prometheus scrape at /actuator/prometheus (public, see README).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Admission control sized for a fraction of a CPU: at most 10 requests run at once, one
# per pooled connection; the rest wait cheaply in Tomcat's connection queue. Measured at
# 0.1 CPU, 20k requests at concurrency 500: unbounded virtual threads starved the threads
# holding connections and gave 262 pool-timeout 500s; this setting gave zero 5xx.
# Raise both numbers together on a bigger instance.
spring.threads.virtual.enabled=false
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=10
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# One JSON object per log line (ECS), with request_id from RequestIdFilter in every line.
logging.structured.format.console=ecs
